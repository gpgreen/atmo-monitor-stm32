[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = "probe-rs run --chip STM32F103CB"
rustflags = [
  "-C", "linker=flip-link",
]

[build]
target = "thumbv7m-none-eabi" # Cortex-M3

[env]
DEFMT_LOG = "trace"

[unstable]
build-std = ["core"]
build-std-features = ["panic_immediate_abort"]

[alias]
rb = "run --bin"
rrb = "run --release --bin"
